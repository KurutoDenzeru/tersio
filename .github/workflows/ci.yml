name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The arm leg is the project's only linux/arm64 coverage. The
        # 26.04 labels are GA on GitHub (changelog 2026-09-17).
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          # Folded scalar: joins with one space, so the key string is
          # unchanged.
          key: >-
            bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock',
            'dashboard/app/bun.lock', '.bun-version') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      # Linking, not downloading, dominates Windows time, so the installed
      # trees are cached directly. A lockfile change produces a new key.
      - name: Cache installed packages
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            dashboard/app/node_modules
          key: >-
            modules-${{ runner.os }}-${{ hashFiles('bun.lock',
            'dashboard/app/bun.lock', '.bun-version') }}
      - name: Install
        run: bun install --frozen-lockfile
      # The layout suite needs POSIX pty/termios, so pyte installs on Linux
      # only; it self-skips elsewhere.
      - name: Install pyte
        if: runner.os == 'Linux'
        # Pinned: upstream releases cannot break the layout suite.
        run: python3 -m pip install --quiet pyte==0.8.2
      - name: Lint
        if: matrix.os == 'ubuntu-26.04'
        run: bun run lint
      # Windows builds the dashboard too: the export and drawer tests read
      # the single-file bundle, so skipping it only moves the failure into the
      # suite.
      - name: Type-check and test
        if: runner.os == 'Windows'
        run: bunx tsc && bun run build:dashboard && bun run test
      - name: Build and test
        if: runner.os != 'Windows'
        run: bun run verify

  # macOS covers the darwin branches, but the primary developers run the
  # suite locally, so it rides on pull requests only.
  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: >-
            bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock',
            'dashboard/app/bun.lock', '.bun-version') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build and test
        run: bun run verify
