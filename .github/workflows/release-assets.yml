name: Release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build and pack
        run: |
          bun install --frozen-lockfile
          bun run build
          bun pm pack --destination .
          mv krtclcdy-tersio-*.tgz tersio-npm.tgz
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" install.sh tersio-npm.tgz --clobber --repo "${GITHUB_REPOSITORY}" \
            || gh release create "${GITHUB_REF_NAME}" install.sh tersio-npm.tgz --generate-notes --repo "${GITHUB_REPOSITORY}"
